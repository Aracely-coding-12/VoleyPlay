<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments :: head('Crear cuenta')}"></head>
  <body class="auth">
    <main class="auth-card">
      <a class="brand" href="/login">
        <span class="brand-icon">
          <svg th:replace="~{fragments :: icon('ball')}"></svg>
        </span>
        Vóley
        <span>Play</span>
      </a>
      <h1>Crear cuenta</h1>
      <p>Regístrate para acceder al panel.</p>
      <div th:replace="~{fragments :: notices}"></div>
      <p th:unless="${enabled}" class="notice">
        El registro aún no está habilitado. Contacta al administrador.
      </p>
      <!-- El formulario aparece cuando el registro está habilitado en Java. -->
      <form th:if="${enabled}" th:action="@{/registro}" method="post">
        <label for="username">Usuario</label>
        <input
          id="username"
          name="username"
          th:value="${newUsername}"
          required
          minlength="3"
          maxlength="40"
          pattern="[a-zA-Z0-9][a-zA-Z0-9._-]{2,39}"
          autocomplete="username">
        <small>De 3 a 40 caracteres: letras, números, puntos y guiones.</small>
        <label for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          required
          minlength="12"
          maxlength="72"
          autocomplete="new-password">
        <small>Mínimo 12 caracteres.</small>
        <label for="confirmation">Confirmar contraseña</label>
        <input
          id="confirmation"
          name="confirmation"
          type="password"
          required
          minlength="12"
          autocomplete="new-password">
        <!-- Solo se pide código cuando el registro funciona por invitación. -->
        <div th:if="${invitationRequired}">
          <label for="invitationCode">Código de invitación</label>
          <input id="invitationCode" name="invitationCode" required>
        </div>
        <button class="primary full">Crear cuenta</button>
      </form>
      <p class="auth-footer">
        <a href="/login">Volver a iniciar sesión</a>
      </p>
    </main>
  </body>
</html>

spring.application.name=VoleyPlay
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true


server.port=${PORT:8080}
frontend.url=${FRONTEND_URL:http://localhost:5173}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
spring.jpa.open-in-view=false
app.registration.mode=${REGISTRATION_MODE:disabled}
app.registration.code=${REGISTRATION_CODE:}

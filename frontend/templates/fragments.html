<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <!-- Partes comunes que las demás páginas incluyen con th:replace. -->
  <head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" th:href="@{/images/pelot.ico}">
    <title th:text="${title} + ' · VóleyPlay'">VóleyPlay</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
  </head>
  <body>
    <!-- Los iconos se dibujan aquí en SVG, sin librerías externas. -->
    <svg
      th:fragment="icon(name)"
      class="icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.7"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true">
      <g th:switch="${name}">
        <g th:case="'inicio'">
          <path d="m3 10 9-7 9 7v10H3z"/>
          <path d="M9 20v-7h6v7"/>
        </g>
        <g th:case="'clientes'">
          <circle cx="9" cy="7" r="3"/>
          <path d="M3 21v-4a6 6 0 0 1 12 0v4m2-17a3 3 0 0 1 0 6m1 5a5 5 0 0 1 3 5"/>
        </g>
        <g th:case="'canchas'">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <path d="M12 4v16M3 12h18"/>
        </g>
        <g th:case="'horarios'">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 6v6l4 2"/>
        </g>
        <g th:case="'reservas'">
          <rect x="3" y="5" width="18" height="16" rx="2"/>
          <path d="M7 3v4m10-4v4M3 11h18m-12 5 2 2 4-4"/>
        </g>
        <g th:case="'pagos'">
          <rect x="2" y="5" width="20" height="14" rx="2"/>
          <path d="M2 10h20m-15 5h3"/>
        </g>
        <g th:case="'edit'">
          <path d="m14 5 5 5M4 20l4-1L20 7l-4-4L4 15z"/>
        </g>
        <g th:case="'trash'">
          <path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/>
        </g>
        <g th:case="'logout'">
          <path d="M9 3H3v18h6m4-5 4-4-4-4m-6 4h14"/>
        </g>
        <g th:case="*">
          <circle cx="12" cy="12" r="9"/>
          <path d="M4 8l16 8M8 3l8 18M3 14l18-4"/>
        </g>
      </g>
    </svg>
    <!-- Menú lateral y usuario conectado. -->
    <aside th:fragment="sidebar" class="sidebar">
      <a class="brand" th:href="@{/panel}">
        <span class="brand-icon">
          <svg th:replace="~{fragments :: icon('ball')}"></svg>
        </span>
        Vóley
        <span>Play</span>
      </a>
      <p class="nav-label">ADMINISTRACIÓN</p>
      <nav>
        <a
          th:each="item : ${ {'inicio','clientes','canchas','horarios','reservas','pagos'} }"
          th:href="${item == 'inicio' ? '/panel' : '/panel/' + item}"
          th:classappend="${active == item ? 'selected' : ''}">
          <svg th:replace="~{fragments :: icon(${item})}"></svg>
          <span th:text="${#strings.capitalize(item)}"></span>
        </a>
      </nav>
      <div class="session">
        <span th:text="${username}"></span>
        <form th:action="@{/logout}" method="post">
          <button class="link-button">
            <svg th:replace="~{fragments :: icon('logout')}"></svg>
            Cerrar sesión
          </button>
        </form>
      </div>
    </aside>
    <!-- Mensajes que envía Java después de guardar o validar un formulario. -->
    <div th:fragment="notices">
      <p th:if="${notice}" class="notice success" role="status" th:text="${notice}"></p>
      <p th:if="${error}" class="notice error" role="alert" th:text="${error}"></p>
    </div>
  </body>
</html>
